<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fantasy MMADNESS</title>
<style>
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.hero{max-width:760px;margin:40px auto;padding:22px;text-align:center}.photo{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid #e51d2a}.tag{color:#aaa}.btn{display:inline-block;background:#e51d2a;color:#fff;text-decoration:none;padding:16px 28px;border-radius:9px;font-weight:800;margin:16px 0;box-shadow:0 0 24px rgba(229,29,42,.35)}.box{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px;text-align:left}.hash{color:#55aaff}
</style>
</head>
<body>
<main class="hero"><div id="app">Loading fighter...</div></main>
<script>
const q=new URLSearchParams(location.search);
const slug=q.get('slug')||location.pathname.split('/').filter(Boolean).pop();
const api=(q.get('api')||localStorage.getItem('fm_api')||'').replace(/\/$/,'');
async function go(){
  if(!slug){document.getElementById('app').innerHTML='<h1>Fantasy MMADNESS</h1><p class="tag">This fighter promo link is incomplete.</p>';return}
  if(!api){document.getElementById('app').innerHTML='<h1>Fantasy MMADNESS</h1><p class="tag">This promo link needs the Fantasy MMADNESS API connection.</p>';return}
  try{
    const r=await fetch(api+'/api/affiliate/'+encodeURIComponent(slug));
    const d=await r.json();
    if(!r.ok)throw Error(d.message||'Affiliate not found');
    const a=d.affiliate;
    localStorage.setItem('fm_api',api);
    localStorage.setItem('fm_affiliate_slug',a.promoSlug);
    if(a.fightId) localStorage.setItem('fm_affiliate_fight_id',a.fightId);
    document.title=a.fighterName+' — Fantasy MMADNESS';
    const playUrl='/?affiliate='+encodeURIComponent(a.promoSlug)+(a.fightId?'&fightId='+encodeURIComponent(a.fightId):'');
    document.getElementById('app').innerHTML=
      (a.imageUrl?'<img class="photo" src="'+a.imageUrl.replace(/"/g,'&quot;')+'" alt="'+a.fighterName.replace(/"/g,'&quot;')+'">':'')+
      '<h1>'+a.fighterName+'</h1><p class="tag">'+(a.instagramHandle?'@'+a.instagramHandle:'')+'</p>'+
      '<h2>'+(a.fightName||'Upcoming Fight')+'</h2>'+
      '<div class="box"><h2>JOIN FANTASY MMADNESS</h2>'+
      '<p>Make your fight prediction and compete for cash and prizes.</p>'+
      '<a class="btn" href="'+playUrl+'" onclick="localStorage.setItem(\'fm_affiliate_slug\',\''+a.promoSlug.replace(/'/g,"\\'")+'\');'+(a.fightId?'localStorage.setItem(\'fm_affiliate_fight_id\',\''+String(a.fightId).replace(/'/g,"\\'")+'\');':'')+'">PLAY THIS FIGHT</a>'+
      '<p class="hash">'+(a.hashtags||[]).map(x=>x.startsWith('#')?x:'#'+x).join(' ')+'</p></div>';
  }catch(e){document.getElementById('app').innerHTML='<h1>Fantasy MMADNESS</h1><p class="tag">'+e.message+'</p>'}
}
go();
</script>
</body>
</html>
